          package com.example.bookreader

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.drawable.Icon
          import android.media.AudioAttributes
          import android.media.AudioFocusRequest
          import android.media.AudioManager
          import android.media.MediaMetadata
          import android.media.session.MediaSession
          import android.media.session.PlaybackState
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import java.util.Locale

          /**
           * Foreground servis koji čita tekst preko Android TTS-a.
           * Radi i kada je ekran zaključan (wake lock + foreground notifikacija + media session).
           */
          class ReaderService : Service(), TextToSpeech.OnInitListener {

              companion object {
                  const val ACTION_PLAY = "com.example.bookreader.PLAY"
                  const val ACTION_PAUSE = "com.example.bookreader.PAUSE"
                  const val ACTION_NEXT = "com.example.bookreader.NEXT"
                  const val ACTION_PREV = "com.example.bookreader.PREV"
                  const val ACTION_STOP = "com.example.bookreader.STOP"
                  const val ACTION_SEEK = "com.example.bookreader.SEEK"
                  const val ACTION_APPLY = "com.example.bookreader.APPLY"
                  const val EXTRA_INDEX = "index"
                  private const val CHANNEL = "reading"
                  private const val NOTIF_ID = 1
              }

              private val main = Handler(Looper.getMainLooper())
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var wantPlay = false
              private var gen = 0
              private var errCount = 0
              private var lastLang = ""
              private var translit = false
              private var session: MediaSession? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private var focusRequest: AudioFocusRequest? = null
              private var resumeOnFocus = false
              private var isForeground = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  createChannel()
                  val s = MediaSession(this, "BookReader")
                  s.setCallback(object : MediaSession.Callback() {
                      override fun onPlay() {
                          play()
                      }

                      override fun onPause() {
                          pause()
                      }

                      override fun onSkipToNext() {
                          seekTo(ReaderState.index + 1)
                      }

                      override fun onSkipToPrevious() {
                          seekTo(ReaderState.index - 1)
                      }

                      override fun onStop() {
                          stopAll()
                      }
                  })
                  s.isActive = true
                  session = s
                  tts = TextToSpeech(applicationContext, this)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_PLAY -> {
                          goForeground()
                          play()
                      }
                      ACTION_PAUSE -> pause()
                      ACTION_NEXT -> seekTo(ReaderState.index + 1)
                      ACTION_PREV -> seekTo(ReaderState.index - 1)
                      ACTION_SEEK -> seekTo(intent?.getIntExtra(EXTRA_INDEX, 0) ?: 0)
                      ACTION_APPLY -> {
                          if (wantPlay && ttsReady) speakCurrent()
                      }
                      ACTION_STOP -> stopAll()
                      else -> {}
                  }
                  if (!isForeground) stopSelf()
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  wantPlay = false
                  ReaderState.playing = false
                  ReaderState.savePos(this)
                  tts?.stop()
                  tts?.shutdown()
                  tts = null
                  releaseWake()
                  abandonFocus()
                  session?.release()
                  session = null
                  ReaderState.changed()
                  super.onDestroy()
              }

              // ---------- TTS ----------

              override fun onInit(status: Int) {
                  if (status != TextToSpeech.SUCCESS) {
                      ttsReady = false
                      ReaderState.error = "Android TTS nije dostupan. Proveri Podešavanja → Opšte upravljanje → Tekst u govor."
                      ReaderState.playing = false
                      wantPlay = false
                      ReaderState.changed()
                      if (isForeground) stopAll()
                      return
                  }
                  ttsReady = true
                  tts?.setAudioAttributes(
                      AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                          .build()
                  )
                  tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(utteranceId: String?) {}

                      override fun onDone(utteranceId: String?) {
                          onUtteranceEnd(utteranceId, false)
                      }

                      @Deprecated("Deprecated in Java")
                      override fun onError(utteranceId: String?) {
                          onUtteranceEnd(utteranceId, true)
                      }

                      override fun onError(utteranceId: String?, errorCode: Int) {
                          onUtteranceEnd(utteranceId, true)
                      }
                  })
                  if (wantPlay) main.post { speakCurrent() }
              }

              private fun onUtteranceEnd(id: String?, error: Boolean) {
                  main.post {
                      if (id == null || !wantPlay) return@post
                      val parts = id.split(":")
                      if (parts.size != 2) return@post
                      if (parts[0].toIntOrNull() != gen) return@post
                      val idx = parts[1].toIntOrNull() ?: return@post
                      if (idx != ReaderState.index) return@post

                      if (error) {
                          errCount++
                          if (errCount >= 3) {
                              failPlayback("Greška pri govoru. Proveri glas u podešavanjima TTS-a.")
                              return@post
                          }
                      } else {
                          errCount = 0
                      }
                      ReaderState.index = idx + 1
                      ReaderState.savePos(this)
                      if (ReaderState.index >= ReaderState.chunks.size) {
                          finishBook()
                      } else {
                          ReaderState.changed()
                          updateNotification()
                          speakCurrent()
                      }
                  }
              }

              private fun applyLanguage(): Boolean {
                  val t = tts ?: return false
                  val mode = ReaderState.langMode
                  val lang = if (mode == "auto") ReaderState.detected else mode
                  if (lang == lastLang) return true
                  val candidates: List<Locale> = when (lang) {
                      "en" -> listOf(Locale.US, Locale.UK, Locale.ENGLISH)
                      "hr" -> listOf(Locale("hr", "HR"), Locale("hr"), Locale("bs", "BA"))
                      else -> listOf(Locale("sr", "RS"), Locale("sr"), Locale("hr", "HR"), Locale("bs", "BA"))
                  }
                  for (loc in candidates) {
                      val r = t.setLanguage(loc)
                      if (r >= TextToSpeech.LANG_AVAILABLE) {
                          lastLang = lang
                          translit = loc.language != "sr" && loc.language != "en"
                          val fallback = lang == "sr" && loc.language != "sr"
                          ReaderState.voiceInfo = "Glas: " + loc.toLanguageTag() + (if (fallback) " (zamena)" else "")
                          return true
                      }
                  }
                  ReaderState.error = "Na telefonu nema glasa za taj jezik. Otvori „Glasovi“ i instaliraj Google Speech Services pa skini glas."
                  return false
              }

              private fun speakCurrent() {
                  val t = tts ?: return
                  if (!wantPlay || !ttsReady) return
                  val chunks = ReaderState.chunks
                  val i = ReaderState.index
                  if (i < 0 || i >= chunks.size) {
                      finishBook()
                      return
                  }
                  if (!applyLanguage()) {
                      failPlayback(ReaderState.error ?: "Nema glasa.")
                      return
                  }
                  acquireWake()
                  t.setSpeechRate(ReaderState.rate)
                  gen++
                  var text = chunks[i]
                  if (translit) text = TextUtil.cyrillicToLatin(text)
                  val r = t.speak(text, TextToSpeech.QUEUE_FLUSH, null, "$gen:$i")
                  if (r == TextToSpeech.ERROR) {
                      errCount++
                      if (errCount >= 3) {
                          failPlayback("TTS ne odgovara. Pokušaj ponovo.")
                      } else {
                          main.postDelayed({ speakCurrent() }, 700)
                      }
                      return
                  }
                  ReaderState.changed()
                  updateNotification()
              }

              // ---------- komande ----------

              private fun play() {
                  if (ReaderState.chunks.isEmpty()) {
                      stopAll()
                      return
                  }
                  if (ReaderState.index >= ReaderState.chunks.size) ReaderState.index = 0
                  wantPlay = true
                  ReaderState.playing = true
                  ReaderState.error = null
                  errCount = 0
                  resumeOnFocus = false
                  requestFocus()
                  acquireWake()
                  goForeground()
                  updateSession()
                  ReaderState.changed()
                  if (ttsReady) speakCurrent()
              }

              private fun pause(keepFocus: Boolean = false) {
                  wantPlay = false
                  ReaderState.playing = false
                  gen++
                  tts?.stop()
                  releaseWake()
                  if (!keepFocus) abandonFocus()
                  ReaderState.savePos(this)
                  updateSession()
                  updateNotification()
                  ReaderState.changed()
              }

              private fun seekTo(i: Int) {
                  val n = ReaderState.chunks.size
                  if (n == 0) return
                  ReaderState.index = i.coerceIn(0, n - 1)
                  ReaderState.savePos(this)
                  ReaderState.changed()
                  if (wantPlay && ttsReady) speakCurrent() else updateNotification()
              }

              private fun finishBook() {
                  ReaderState.index = 0
                  ReaderState.savePos(this)
                  stopAll()
              }

              private fun failPlayback(msg: String) {
                  ReaderState.error = msg
                  pause()
              }

              private fun stopAll() {
                  pause()
                  if (isForeground) {
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      isForeground = false
                  }
                  stopSelf()
              }

              // ---------- audio fokus, wake lock ----------

              private fun requestFocus() {
                  val am = getSystemService(AudioManager::class.java) ?: return
                  val req = focusRequest ?: AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN)
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build()
                      )
                      .setOnAudioFocusChangeListener { change -> main.post { onFocus(change) } }
                      .build()
                      .also { focusRequest = it }
                  am.requestAudioFocus(req)
              }

              private fun abandonFocus() {
                  val req = focusRequest ?: return
                  getSystemService(AudioManager::class.java)?.abandonAudioFocusRequest(req)
              }

              private fun onFocus(change: Int) {
                  when (change) {
                      AudioManager.AUDIOFOCUS_LOSS -> {
                          resumeOnFocus = false
                          pause()
                      }
                      AudioManager.AUDIOFOCUS_LOSS_TRANSIENT -> {
                          if (wantPlay) {
                              resumeOnFocus = true
                              pause(true)
                          }
                      }
                      AudioManager.AUDIOFOCUS_GAIN -> {
                          if (resumeOnFocus) {
                              resumeOnFocus = false
                              play()
                          }
                      }
                  }
              }

              private fun acquireWake() {
                  if (wakeLock == null) {
                      val pm = getSystemService(PowerManager::class.java)
                      wakeLock = pm?.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "bookreader:tts")
                  }
                  val wl = wakeLock ?: return
                  if (!wl.isHeld) wl.acquire(6 * 60 * 60 * 1000L)
              }

              private fun releaseWake() {
                  val wl = wakeLock ?: return
                  if (wl.isHeld) wl.release()
              }

              // ---------- notifikacija i media session ----------

              private fun createChannel() {
                  val nm = getSystemService(NotificationManager::class.java)
                  val ch = NotificationChannel(CHANNEL, "Čitanje knjige", NotificationManager.IMPORTANCE_LOW)
                  ch.lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                  ch.setShowBadge(false)
                  nm.createNotificationChannel(ch)
              }

              private fun goForeground() {
                  startForeground(NOTIF_ID, buildNotification(), ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
                  isForeground = true
              }

              private fun updateNotification() {
                  if (!isForeground) return
                  getSystemService(NotificationManager::class.java).notify(NOTIF_ID, buildNotification())
              }

              private fun updateSession() {
                  val s = session ?: return
                  val playing = ReaderState.playing
                  s.setPlaybackState(
                      PlaybackState.Builder()
                          .setActions(
                              PlaybackState.ACTION_PLAY or PlaybackState.ACTION_PAUSE or
                                  PlaybackState.ACTION_PLAY_PAUSE or PlaybackState.ACTION_SKIP_TO_NEXT or
                                  PlaybackState.ACTION_SKIP_TO_PREVIOUS or PlaybackState.ACTION_STOP
                          )
                          .setState(
                              if (playing) PlaybackState.STATE_PLAYING else PlaybackState.STATE_PAUSED,
                              ReaderState.index.toLong(),
                              if (playing) 1f else 0f
                          )
                          .build()
                  )
                  s.setMetadata(
                      MediaMetadata.Builder()
                          .putString(MediaMetadata.METADATA_KEY_TITLE, ReaderState.title)
                          .build()
                  )
              }

              private fun serviceAction(icon: Int, label: String, action: String, req: Int): Notification.Action {
                  val pi = PendingIntent.getService(
                      this, req,
                      Intent(this, ReaderService::class.java).setAction(action),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  return Notification.Action.Builder(Icon.createWithResource(this, icon), label, pi).build()
              }

              private fun buildNotification(): Notification {
                  val playing = ReaderState.playing
                  val open = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val snippet = ReaderState.chunks.getOrNull(ReaderState.index) ?: ""
                  val b = Notification.Builder(this, CHANNEL)
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentTitle(if (ReaderState.title.isEmpty()) "Čitač knjiga" else ReaderState.title)
                      .setContentText(snippet.take(80))
                      .setContentIntent(open)
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .setOngoing(playing)
                      .setOnlyAlertOnce(true)
                      .addAction(serviceAction(android.R.drawable.ic_media_previous, "Nazad", ACTION_PREV, 1))
                      .addAction(
                          if (playing) serviceAction(android.R.drawable.ic_media_pause, "Pauza", ACTION_PAUSE, 2)
                          else serviceAction(android.R.drawable.ic_media_play, "Pusti", ACTION_PLAY, 2)
                      )
                      .addAction(serviceAction(android.R.drawable.ic_media_next, "Napred", ACTION_NEXT, 3))
                      .addAction(serviceAction(android.R.drawable.ic_menu_close_clear_cancel, "Zatvori", ACTION_STOP, 4))
                  val s = session
                  if (s != null) {
                      b.setStyle(
                          Notification.MediaStyle()
                              .setMediaSession(s.sessionToken)
                              .setShowActionsInCompactView(0, 1, 2)
                      )
                  }
                  return b.build()
              }
          }
