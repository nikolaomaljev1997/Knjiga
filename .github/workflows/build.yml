          package com.example.bookreader

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import java.util.concurrent.CopyOnWriteArrayList

          /** Stanje koje dele aktivnost i servis (isti proces). */
          object ReaderState {
              @Volatile var chunks: List<String> = emptyList()
              @Volatile var index: Int = 0
              @Volatile var playing: Boolean = false
              @Volatile var title: String = ""
              @Volatile var docKey: String = ""

              /** "auto", "en", "sr" ili "hr" (srpski preko hrvatskog glasa) */
              @Volatile var langMode: String = "auto"
              @Volatile var detected: String = "en"
              @Volatile var rate: Float = 1.0f
              @Volatile var voiceInfo: String = ""
              @Volatile var error: String? = null

              private val main = Handler(Looper.getMainLooper())
              private val listeners = CopyOnWriteArrayList<() -> Unit>()

              fun addListener(l: () -> Unit) {
                  listeners.add(l)
              }

              fun removeListener(l: () -> Unit) {
                  listeners.remove(l)
              }

              fun changed() {
                  main.post {
                      for (l in listeners) l()
                  }
              }

              fun savePos(ctx: Context) {
                  if (docKey.isEmpty()) return
                  ctx.getSharedPreferences("reader", Context.MODE_PRIVATE)
                      .edit()
                      .putInt("pos_$docKey", index)
                      .apply()
              }
          }
