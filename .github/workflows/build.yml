          cat > 'app/src/main/java/com/example/bookreader/BookLoader.kt' <<'EOF_4299A51A'
          package com.example.bookreader

          import android.content.Context
          import android.net.Uri
          import android.provider.OpenableColumns
          import com.tom_roush.pdfbox.android.PDFBoxResourceLoader
          import com.tom_roush.pdfbox.pdmodel.PDDocument
          import com.tom_roush.pdfbox.text.PDFTextStripper
          import org.jsoup.Jsoup
          import org.jsoup.parser.Parser
          import java.io.BufferedInputStream
          import java.io.ByteArrayInputStream
          import java.io.IOException
          import java.nio.ByteBuffer
          import java.nio.charset.CharacterCodingException
          import java.nio.charset.Charset
          import java.nio.charset.CodingErrorAction
          import java.util.zip.ZipInputStream

          object BookLoader {

              class Book(val title: String, val text: String)

              fun load(ctx: Context, uri: Uri): Book {
                  val name = displayName(ctx, uri)
                  val mime = ctx.contentResolver.getType(uri) ?: ""
                  val lower = name.lowercase()
                  val text = when {
                      lower.endsWith(".pdf") || mime == "application/pdf" -> readPdf(ctx, uri)
                      lower.endsWith(".epub") || mime == "application/epub+zip" -> readEpub(ctx, uri)
                      else -> readTxt(ctx, uri)
                  }
                  return Book(name.substringBeforeLast('.', name), text)
              }

              private fun displayName(ctx: Context, uri: Uri): String {
                  try {
                      ctx.contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use { c ->
                          if (c.moveToFirst()) {
                              val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                              if (i >= 0) {
                                  val n = c.getString(i)
                                  if (!n.isNullOrEmpty()) return n
                              }
                          }
                      }
                  } catch (e: Exception) {
                      // ignorisemo
                  }
                  return uri.lastPathSegment ?: "knjiga"
              }

              private fun open(ctx: Context, uri: Uri) =
                  ctx.contentResolver.openInputStream(uri) ?: throw IOException("Ne mogu da otvorim fajl")

              // ---------- TXT ----------

              private fun readTxt(ctx: Context, uri: Uri): String {
                  val bytes = open(ctx, uri).use { it.readBytes() }
                  return decode(bytes)
              }

              private fun decode(bytes: ByteArray): String {
                  if (bytes.size >= 2) {
                      val b0 = bytes[0].toInt() and 0xFF
                      val b1 = bytes[1].toInt() and 0xFF
                      if (b0 == 0xFF && b1 == 0xFE) return String(bytes, Charsets.UTF_16LE).removePrefix("﻿")
                      if (b0 == 0xFE && b1 == 0xFF) return String(bytes, Charsets.UTF_16BE).removePrefix("﻿")
                  }
                  val dec = Charsets.UTF_8.newDecoder()
                      .onMalformedInput(CodingErrorAction.REPORT)
                      .onUnmappableCharacter(CodingErrorAction.REPORT)
                  return try {
                      dec.decode(ByteBuffer.wrap(bytes)).toString().removePrefix("﻿")
                  } catch (e: CharacterCodingException) {
                      // stari srpski/hrvatski txt fajlovi su često u Windows-1250
                      String(bytes, Charset.forName("windows-1250"))
                  }
              }

              // ---------- PDF ----------

              private fun readPdf(ctx: Context, uri: Uri): String {
                  PDFBoxResourceLoader.init(ctx.applicationContext)
                  return open(ctx, uri).use { ins ->
                      PDDocument.load(ins).use { doc ->
                          val stripper = PDFTextStripper()
                          val sb = StringBuilder()
                          val n = doc.numberOfPages
                          for (p in 1..n) {
                              stripper.startPage = p
                              stripper.endPage = p
                              sb.append(stripper.getText(doc)).append("\n\n")
                          }
                          sb.toString()
                      }
                  }
              }

              // ---------- EPUB ----------

              private fun readEpub(ctx: Context, uri: Uri): String {
                  val files = HashMap<String, ByteArray>()
                  ZipInputStream(BufferedInputStream(open(ctx, uri))).use { zin ->
                      var e = zin.nextEntry
                      while (e != null) {
                          val ln = e.name.lowercase()
                          if (!e.isDirectory && (ln.endsWith(".xhtml") || ln.endsWith(".html") || ln.endsWith(".htm") ||
                                      ln.endsWith(".opf") || ln.endsWith(".xml") || ln.endsWith(".ncx"))
                          ) {
                              files[e.name] = zin.readBytes()
                          }
                          e = zin.nextEntry
                      }
                  }

                  val container = files["META-INF/container.xml"] ?: throw IOException("Nije ispravan EPUB fajl")
                  val cdoc = Jsoup.parse(String(container, Charsets.UTF_8), "", Parser.xmlParser())
                  val opfPath = cdoc.selectFirst("rootfile")?.attr("full-path")
                  if (opfPath.isNullOrEmpty()) throw IOException("Nije ispravan EPUB fajl")
                  val opf = files[opfPath] ?: throw IOException("Nije ispravan EPUB fajl")
                  val odoc = Jsoup.parse(String(opf, Charsets.UTF_8), "", Parser.xmlParser())
                  val base = if (opfPath.contains('/')) opfPath.substringBeforeLast('/') + "/" else ""

                  val manifest = HashMap<String, String>()
                  for (item in odoc.select("item")) {
                      manifest[item.attr("id")] = item.attr("href")
                  }

                  val sb = StringBuilder()
                  for (ref in odoc.select("itemref")) {
                      val href = manifest[ref.attr("idref")] ?: continue
                      val path = resolve(base, Uri.decode(href.substringBefore('#')))
                      val bytes = files[path] ?: continue
                      val html = Jsoup.parse(ByteArrayInputStream(bytes), "UTF-8", "")
                      val els = html.select("h1, h2, h3, h4, h5, h6, p, li")
                      if (els.isEmpty()) {
                          sb.append(html.body().text())
                      } else {
                          for (el in els) {
                              val t = el.text().trim()
                              if (t.isNotEmpty()) sb.append(t).append("\n\n")
                          }
                      }
                      sb.append("\n\n")
                  }
                  return sb.toString()
              }

              private fun resolve(base: String, rel: String): String {
                  val parts = ArrayList<String>()
                  for (p in (base + rel).split('/')) {
                      if (p.isEmpty() || p == ".") continue
                      if (p == "..") {
                          if (parts.isNotEmpty()) parts.removeAt(parts.size - 1)
                      } else {
                          parts.add(p)
                      }
                  }
                  return parts.joinToString("/")
              }
          }
          EOF_4299A51A
          mkdir -p 'app/src/main/java/com/example/bookreader'
          cat > 'app/src/main/java/com/example/bookreader/MainActivity.kt' <<'EOF_904BD646'
          package com.example.bookreader

          import android.Manifest
          import android.app.Activity
          import android.content.ActivityNotFoundException
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.view.ViewGroup
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import java.io.IOException
          import java.util.Locale
          import kotlin.math.roundToInt

          class MainActivity : Activity() {

              private val REQ_OPEN = 11
              private val REQ_NOTIF = 12

              private val prefs by lazy { getSharedPreferences("reader", MODE_PRIVATE) }

              private lateinit var titleView: TextView
              private lateinit var statusView: TextView
              private lateinit var textView: TextView
              private lateinit var seek: SeekBar
              private lateinit var playBtn: Button
              private lateinit var rateLabel: TextView
              private lateinit var rateSeek: SeekBar
              private lateinit var langSpinner: Spinner

              private var userSeeking = false
              private val listener: () -> Unit = { refresh() }

              private val langValues = listOf("auto", "en", "sr", "hr")
              private val langNames = listOf("Automatski", "English", "Srpski", "Srpski (hrvatski glas)")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  ReaderState.rate = prefs.getFloat("rate", 1.0f)
                  ReaderState.langMode = prefs.getString("lang", "auto") ?: "auto"
                  buildUi()
                  val handled = handleIntent(intent)
                  if (!handled && ReaderState.chunks.isEmpty()) {
                      val last = prefs.getString("last_uri", null)
                      if (last != null) openUri(Uri.parse(last))
                  }
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  if (intent != null) setIntent(intent)
                  handleIntent(intent)
              }

              override fun onStart() {
                  super.onStart()
                  ReaderState.addListener(listener)
                  refresh()
              }

              override fun onStop() {
                  ReaderState.removeListener(listener)
                  super.onStop()
              }

              private fun handleIntent(i: Intent?): Boolean {
                  val data = i?.data
                  if (i?.action == Intent.ACTION_VIEW && data != null) {
                      openUri(data)
                      return true
                  }
                  return false
              }

              // ---------- UI ----------

              private fun buildUi() {
                  val d = resources.displayMetrics.density
                  val pad = (16 * d).toInt()
                  val match = ViewGroup.LayoutParams.MATCH_PARENT
                  val wrap = ViewGroup.LayoutParams.WRAP_CONTENT

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(pad, pad, pad, pad)

                  titleView = TextView(this)
                  titleView.textSize = 20f
                  titleView.setTypeface(null, Typeface.BOLD)
                  root.addView(titleView, LinearLayout.LayoutParams(match, wrap))

                  val openBtn = Button(this)
                  openBtn.text = "Otvori knjigu (PDF / TXT / EPUB)"
                  openBtn.setOnClickListener { pickFile() }
                  root.addView(openBtn, LinearLayout.LayoutParams(match, wrap))

                  statusView = TextView(this)
                  statusView.textSize = 14f
                  root.addView(statusView, LinearLayout.LayoutParams(match, wrap))

                  textView = TextView(this)
                  textView.textSize = 18f
                  textView.setLineSpacing(0f, 1.2f)
                  textView.setTextIsSelectable(true)
                  val scroll = ScrollView(this)
                  scroll.addView(textView)
                  root.addView(scroll, LinearLayout.LayoutParams(match, 0, 1f))

                  seek = SeekBar(this)
                  seek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (fromUser) statusView.text = "Deo ${progress + 1} / ${ReaderState.chunks.size}"
                      }

                      override fun onStartTrackingTouch(sb: SeekBar?) {
                          userSeeking = true
                      }

                      override fun onStopTrackingTouch(sb: SeekBar?) {
                          userSeeking = false
                          jump(sb?.progress ?: 0)
                      }
                  })
                  root.addView(seek, LinearLayout.LayoutParams(match, wrap))

                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  val prev = Button(this)
                  prev.text = "« Nazad"
                  prev.setOnClickListener { jump(ReaderState.index - 1) }
                  playBtn = Button(this)
                  playBtn.text = "Pusti"
                  playBtn.setOnClickListener { togglePlay() }
                  val next = Button(this)
                  next.text = "Napred »"
                  next.setOnClickListener { jump(ReaderState.index + 1) }
                  row.addView(prev, LinearLayout.LayoutParams(0, wrap, 1f))
                  row.addView(playBtn, LinearLayout.LayoutParams(0, wrap, 1.3f))
                  row.addView(next, LinearLayout.LayoutParams(0, wrap, 1f))
                  root.addView(row, LinearLayout.LayoutParams(match, wrap))

                  rateLabel = TextView(this)
                  root.addView(rateLabel, LinearLayout.LayoutParams(match, wrap))
                  rateSeek = SeekBar(this)
                  rateSeek.max = 15
                  rateSeek.progress = ((ReaderState.rate - 0.5f) * 10f).roundToInt().coerceIn(0, 15)
                  updateRateLabel()
                  rateSeek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          ReaderState.rate = 0.5f + progress * 0.1f
                          updateRateLabel()
                      }

                      override fun onStartTrackingTouch(sb: SeekBar?) {}

                      override fun onStopTrackingTouch(sb: SeekBar?) {
                          prefs.edit().putFloat("rate", ReaderState.rate).apply()
                          if (ReaderState.playing) cmd(ReaderService.ACTION_APPLY)
                      }
                  })
                  root.addView(rateSeek, LinearLayout.LayoutParams(match, wrap))

                  langSpinner = Spinner(this)
                  langSpinner.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, langNames)
                  langSpinner.setSelection(langValues.indexOf(ReaderState.langMode).coerceAtLeast(0), false)
                  langSpinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          val v = langValues[position]
                          if (v != ReaderState.langMode) {
                              ReaderState.langMode = v
                              prefs.edit().putString("lang", v).apply()
                              if (ReaderState.playing) cmd(ReaderService.ACTION_APPLY)
                          }
                      }

                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }
                  root.addView(langSpinner, LinearLayout.LayoutParams(match, wrap))

                  val row2 = LinearLayout(this)
                  row2.orientation = LinearLayout.HORIZONTAL
                  val voices = Button(this)
                  voices.text = "Glasovi"
                  voices.setOnClickListener { openVoiceSettings() }
                  val battery = Button(this)
                  battery.text = "Baterija"
                  battery.setOnClickListener { openBatterySettings() }
                  row2.addView(voices, LinearLayout.LayoutParams(0, wrap, 1f))
                  row2.addView(battery, LinearLayout.LayoutParams(0, wrap, 1f))
                  root.addView(row2, LinearLayout.LayoutParams(match, wrap))

                  setContentView(root)
              }

              private fun updateRateLabel() {
                  rateLabel.text = String.format(Locale.US, "Brzina čitanja: %.1fx", ReaderState.rate)
              }

              private fun refresh() {
                  val n = ReaderState.chunks.size
                  titleView.text = if (ReaderState.title.isEmpty()) "Čitač knjiga" else ReaderState.title
                  if (n == 0) {
                      statusView.text = ReaderState.error ?: "Otvori knjigu da počneš."
                      textView.text = ""
                      seek.max = 0
                      playBtn.text = "Pusti"
                      return
                  }
                  val i = ReaderState.index.coerceIn(0, n - 1)
                  textView.text = ReaderState.chunks[i]
                  if (!userSeeking) {
                      seek.max = n - 1
                      seek.progress = i
                  }
                  var s = "Deo ${i + 1} / $n"
                  if (ReaderState.voiceInfo.isNotEmpty()) s += "  •  " + ReaderState.voiceInfo
                  val err = ReaderState.error
                  if (err != null) s += "\n" + err
                  statusView.text = s
                  playBtn.text = if (ReaderState.playing) "Pauza" else "Pusti"
              }

              // ---------- akcije ----------

              private fun cmd(action: String, index: Int = -1) {
                  val i = Intent(this, ReaderService::class.java).setAction(action)
                  if (index >= 0) i.putExtra(ReaderService.EXTRA_INDEX, index)
                  if (action == ReaderService.ACTION_PLAY) startForegroundService(i) else startService(i)
              }

              private fun togglePlay() {
                  if (ReaderState.chunks.isEmpty()) {
                      Toast.makeText(this, "Prvo otvori knjigu", Toast.LENGTH_SHORT).show()
                      return
                  }
                  if (ReaderState.playing) {
                      cmd(ReaderService.ACTION_PAUSE)
                  } else {
                      askNotificationPermission()
                      ReaderState.error = null
                      cmd(ReaderService.ACTION_PLAY)
                  }
              }

              private fun jump(newIndex: Int) {
                  val n = ReaderState.chunks.size
                  if (n == 0) return
                  val i = newIndex.coerceIn(0, n - 1)
                  if (ReaderState.playing) {
                      cmd(ReaderService.ACTION_SEEK, i)
                  } else {
                      ReaderState.index = i
                      ReaderState.savePos(this)
                      refresh()
                  }
              }

              private fun askNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), REQ_NOTIF)
                  }
              }

              private fun pickFile() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "*/*"
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                  startActivityForResult(i, REQ_OPEN)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_OPEN && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return
                      try {
                          contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      } catch (e: Exception) {
                          // nije kritično
                      }
                      openUri(uri)
                  }
              }

              private fun openVoiceSettings() {
                  try {
                      startActivity(Intent("com.android.settings.TTS_SETTINGS"))
                  } catch (e: ActivityNotFoundException) {
                      startActivity(Intent(Settings.ACTION_SETTINGS))
                  }
              }

              private fun openBatterySettings() {
                  try {
                      startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATIONS_SETTINGS))
                  } catch (e: ActivityNotFoundException) {
                      startActivity(Intent(Settings.ACTION_SETTINGS))
                  }
              }

              private fun openUri(uri: Uri) {
                  if (ReaderState.playing) cmd(ReaderService.ACTION_PAUSE)
                  statusView.text = "Učitavam…"
                  Thread {
                      try {
                          val book = BookLoader.load(applicationContext, uri)
                          val cleaned = TextUtil.clean(book.text)
                          if (cleaned.length < 20) {
                              throw IOException("U fajlu nema teksta (možda je skeniran PDF bez prepoznatog teksta).")
                          }
                          val chunks = TextUtil.chunk(cleaned)
                          if (chunks.isEmpty()) throw IOException("U fajlu nema teksta.")
                          val detected = TextUtil.detectLang(cleaned)
                          val key = uri.toString().hashCode().toString()
                          val pos = prefs.getInt("pos_$key", 0).coerceIn(0, chunks.size - 1)
                          runOnUiThread {
                              ReaderState.chunks = chunks
                              ReaderState.index = pos
                              ReaderState.title = book.title
                              ReaderState.docKey = key
                              ReaderState.detected = detected
                              ReaderState.error = null
                              prefs.edit().putString("last_uri", uri.toString()).apply()
                              refresh()
                          }
                      } catch (e: Throwable) {
                          val msg = e.message ?: e.javaClass.simpleName
                          runOnUiThread { statusView.text = "Greška: $msg" }
                      }
                  }.start()
              }
          }
          EOF_904BD646
