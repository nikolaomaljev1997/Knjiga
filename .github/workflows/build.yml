          package com.example.bookreader

          import java.text.BreakIterator
          import java.util.Locale

          object TextUtil {

              // ---------- ćirilica -> latinica ----------

              private val cyrMap: Map<Char, String> by lazy {
                  val up = mapOf(
                      'А' to "A", 'Б' to "B", 'В' to "V", 'Г' to "G", 'Д' to "D", 'Ђ' to "Đ", 'Е' to "E",
                      'Ж' to "Ž", 'З' to "Z", 'И' to "I", 'Ј' to "J", 'К' to "K", 'Л' to "L", 'Љ' to "Lj",
                      'М' to "M", 'Н' to "N", 'Њ' to "Nj", 'О' to "O", 'П' to "P", 'Р' to "R", 'С' to "S",
                      'Т' to "T", 'Ћ' to "Ć", 'У' to "U", 'Ф' to "F", 'Х' to "H", 'Ц' to "C", 'Ч' to "Č",
                      'Џ' to "Dž", 'Ш' to "Š"
                  )
                  val m = HashMap<Char, String>()
                  for ((k, v) in up) {
                      m[k] = v
                      m[k.lowercaseChar()] = v.lowercase()
                  }
                  m
              }

              fun cyrillicToLatin(s: String): String {
                  val sb = StringBuilder(s.length + 16)
                  for (c in s) {
                      val r = cyrMap[c]
                      if (r != null) sb.append(r) else sb.append(c)
                  }
                  return sb.toString()
              }

              // ---------- prepoznavanje jezika ----------

              private val EN = setOf(
                  "the", "and", "of", "in", "is", "that", "it", "was", "for", "with", "as", "he", "she",
                  "his", "her", "you", "had", "not", "but", "this", "they", "have", "from", "which", "were"
              )
              private val SR = setOf(
                  "je", "se", "da", "su", "na", "za", "sam", "nije", "ali", "od", "što", "sto", "kako",
                  "ili", "bio", "bila", "ovo", "ono", "koji", "kao", "će", "ce", "mi", "ga", "li", "po",
                  "sve", "još", "jos", "samo", "bi", "ću", "cu", "ima", "su", "tako", "kad", "kada"
              )

              /** Vraća "sr" ili "en". */
              fun detectLang(text: String): String {
                  val s = text.take(8000)
                  var cyr = 0
                  var diac = 0
                  for (c in s) {
                      if (c in 'Ѐ'..'ӿ') cyr++
                      else if ("čćšžđČĆŠŽĐ".indexOf(c) >= 0) diac++
                  }
                  if (cyr > 30) return "sr"
                  if (diac > 5) return "sr"
                  var en = 0
                  var sr = 0
                  for (w in s.lowercase().split(Regex("[^\\p{L}]+"))) {
                      if (w in EN) en++ else if (w in SR) sr++
                  }
                  return if (sr > en) "sr" else "en"
              }

              // ---------- čišćenje i deljenje na delove ----------

              fun clean(raw: String): String {
                  var t = raw.replace("\r\n", "\n").replace('\r', '\n').replace(' ', ' ')
                  // spojene reči sa crticom na kraju reda
                  t = t.replace(Regex("(\\p{L})-\\n(\\p{Ll})"), "$1$2")
                  // jedan novi red usred rečenice -> razmak
                  t = t.replace(Regex("""(?<![.!?…:;"”»)\n])\n(?!\n)"""), " ")
                  t = t.replace(Regex("[ \\t]+"), " ")
                  t = t.replace(Regex(" ?\\n ?"), "\n")
                  t = t.replace(Regex("\\n{3,}"), "\n\n")
                  return t.trim()
              }

              fun chunk(text: String, target: Int = 350, max: Int = 1200): List<String> {
                  val out = ArrayList<String>()
                  val buf = StringBuilder()
                  val bi = BreakIterator.getSentenceInstance(Locale.ENGLISH)

                  fun flush() {
                      val s = buf.toString().trim()
                      if (s.isNotEmpty()) out.add(s)
                      buf.setLength(0)
                  }

                  for (p in text.split("\n")) {
                      val para = p.trim()
                      if (para.isEmpty()) continue
                      bi.setText(para)
                      var start = bi.first()
                      var end = bi.next()
                      while (end != BreakIterator.DONE) {
                          val sent = para.substring(start, end).trim()
                          start = end
                          end = bi.next()
                          if (sent.isEmpty()) continue
                          if (sent.length > max) {
                              flush()
                              for (part in splitLong(sent, max)) out.add(part)
                              continue
                          }
                          if (buf.isNotEmpty() && buf.length + sent.length + 1 > target) flush()
                          if (buf.isNotEmpty()) buf.append(' ')
                          buf.append(sent)
                      }
                      flush()
                  }
                  return out
              }

              private fun splitLong(s: String, max: Int): List<String> {
                  val res = ArrayList<String>()
                  var rest = s
                  while (rest.length > max) {
                      var cut = rest.lastIndexOf(' ', max)
                      if (cut < max / 2) cut = max
                      res.add(rest.substring(0, cut).trim())
                      rest = rest.substring(cut).trim()
                  }
                  if (rest.isNotEmpty()) res.add(rest)
                  return res
              }
          }
